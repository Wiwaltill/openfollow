name: Build macOS Apple Silicon DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Homebrew dependencies
        run: brew install pygobject3 gstreamer librsvg create-dmg

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Build DMG
        run: |
          poetry env use python3.13
          make dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v5
        with:
          name: OpenFollow-macOS-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
